# configs/loss/interpretable.yaml
_target_: babysteerling.loss.CompositeLoss

losses:
  token:
    - _target_: babysteerling.loss.DiffusionTokenLoss
    - 1.0
  concept:
    - _target_: babysteerling.loss.DiffusionConceptLoss
    - 1.0
  steering:
    - _target_: babysteerling.loss.ExpressLoss
    - 1.0
  respond:
    - _target_: babysteerling.loss.RespondLoss
    - 1.0
  independence:
    - _target_: babysteerling.loss.IndependenceLoss
    - 1.0
  reconstruction:
    - _target_: babysteerling.loss.ReconstructionLoss
    - 1.0

metrics:
  token_accuracy:
    _target_: babysteerling.metric.TokenAccuracy
  concept_auc:
    _target_: babysteerling.metric.ConceptAUC
