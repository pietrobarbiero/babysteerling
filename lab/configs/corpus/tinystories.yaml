# Describes the raw corpus/corpora: where to get them and how they're structured. How they're
# processed is atlas.*, a separate concern. `sources` is always a list, one entry per corpus.
# To train on a union of corpora, add more entries here (or copy this file, e.g.
# configs/corpus/my_union.yaml, and run `python build_dataset.py corpus=my_union`). Every source
# is downloaded, tagged, and assigned independently, but they all share one concept library and
# one tokenizer, which is what makes it a real union rather than concatenated datasets.
#
# Each source has its own document_delimiter, whatever string its raw file uses to separate
# documents (sources can differ here). Nothing in babysteerling is specific to TinyStories; it
# just needs plain-text files with documents separated by a delimiter, each short enough to be
# one chunk.
tokenizer_vocab_size: 2000
# marker the pipeline inserts after every chunk in the tokenized stream. Unlike
# document_delimiter above, it isn't read from any source's raw text, so it stays one value
# even when sources use different delimiters (see prepare.train_tokenizer()).
boundary_token: "<|endoftext|>"

sources:
  - name: tinystories
    url: https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt
    document_delimiter: "<|endoftext|>"
  # - name: my_other_corpus
  #   url: https://example.com/my_other_corpus.txt
  #   document_delimiter: "<|endoftext|>"
