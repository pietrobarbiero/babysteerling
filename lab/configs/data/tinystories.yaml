# Points at build_dataset.py's output (default atlas.output_dir: ./data). Run
# `python build_dataset.py` first if this doesn't exist yet; experiments/ builds and owns its
# own dataset, independent of the numbered folders.
data_dir: ./data
block_size: 256   # context length (tokens per training window)
batch_size: 64
min_lifted_tokens: 5  # drop concepts with fewer lifted tokens than this (see filter_concepts_by_lifted_tokens)

# DataLoader settings
train_val_split: 0.9
num_workers: 4
pin_memory: true  # DataLoader pin_memory=True (recommended for GPU training)