# Default architecture: matches 3_steerling/gpt_steerling.py's hyperparameters.
wandb_name: base  # W&B run display name when this model config is used (see configs/wandb/default.yaml)
n_embed: 128
num_heads: 4
num_kv_heads: 2
n_layers: 4
dropout: 0.2

# backbone: causal (next-token prediction, is_causal=True attention) or diffusion (masked
# diffusion objective, block-causal attention; see configs/model/diffusion.yaml)
backbone_type: causal
diff_block_len: null  # required when backbone_type: diffusion (block_size must be divisible by it)

# concept bottleneck
interpretable: true  # false drops the bottleneck: a plain-LM baseline for measuring what it costs
unknown_ratio: 3     # m (unknown concepts) = unknown_ratio * n (known concepts)
unknown_rank: null   # set an int (e.g. 32) to low-rank factorize the unknown embedding table
top_k_known: null    # set an int to sparsify known-concept activations per token
top_k_unknown: null  # set an int to sparsify unknown-concept activations per token
p_epsilon: 0.1        # residual dropout

# classification head
head:
  type: linear      # linear | mlp
  tie_weights: true  # tie head weights to the token embedding (linear head only)
  mlp_hidden: null   # hidden width for the mlp head; defaults to n_embed if null

# known-concept encoder: "dense" is a simple linear dense layer
known_encoder_type: dense
# whether ConceptLoss contributes to training at all.
use_concept_loss: true
candidates_per_token: 25  # linear_selector only: how many concepts to score per token (its only sparsity mechanism)
topk_axis: 5          # product_key only: candidates per token = topk_axis**2
chunk_size: 4096       # prototype_attention only: concepts processed per chunk
known_key_dim: null    # shared query/key projection width for any of the three; defaults to min(n_embed, 32) if null
use_checkpoint: true   # prototype_attention only: gradient-checkpoint each chunk to bound backward memory
# linear_selector/product_key/prototype_attention only: cap on prototype text length in tokens.
max_prototype_tokens: 32
# linear_selector/product_key only: "prototype" (default, score against concept_prototypes.json's
# LLM-generated sentences) or "lifted_tokens" (score against each concept's own top lifted tokens
# instead -- see configs/model/linear_selector_lifted_tokens.yaml). See nn.prototype.
predictor_type: prototype
lifted_top_k: 5  # predictor_type=lifted_tokens only: how many positive/negative lifted tokens per concept

# memory head
memory_embedding_dims: 8
memory_size: 3
init_temperature: 5.0
final_temperature: 0.1